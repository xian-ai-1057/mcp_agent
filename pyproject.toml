[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-agent"
version = "0.3.0"
description = "General-purpose tool-calling agent with a glossary-backed translation MCP server"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.9",
    "pydantic>=2.7",
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
]

[project.scripts]
mcp-agent = "agent.cli:main"

[tool.setuptools]
packages = ["agent", "contracts", "glossary", "tools", "evals"]
py-modules = ["server"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["error::DeprecationWarning:agent.*"]
