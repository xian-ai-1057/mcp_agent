[build-system]
requires = ["setuptools>=83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-agent"
version = "0.4.0"
description = "Configurable general-purpose agent host for isolated MCP capability servers"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.140.7,<1",
    "mcp>=1.28.1,<2",
    "pydantic>=2.13.4,<3",
    "httpx>=0.28.1,<1",
    "python-dotenv>=1.2.2,<2",
    "uvicorn>=0.51.0,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1,<10",
    "pytest-asyncio>=1.4.0,<2",
    "ruff>=0.16.0,<0.17",
    "setuptools>=83.0.0,<84",
    "wheel>=0.47.0,<1",
]

[project.scripts]
mcp-agent = "agent.cli:main"
mcp-agent-web = "agent.web:main"
mcp-agent-utilities = "mcp_servers.utilities:main"
mcp-agent-translation = "mcp_servers.translation:main"
mcp-agent-rag-upload = "mcp_servers.rag_upload.server:main"

[tool.setuptools]
py-modules = ["server"]

[tool.setuptools.packages.find]
where = ["."]
include = [
    "agent*",
    "capabilities*",
    "contracts*",
    "data*",
    "evals*",
    "fixtures*",
    "glossary*",
    "mcp_servers*",
    "tools*",
]
exclude = ["tests*"]

[tool.setuptools.package-data]
agent = ["static/*.html"]
data = ["glossary.csv"]
fixtures = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["error::DeprecationWarning:agent.*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
